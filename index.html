<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GLM 用量监控 - 智谱 Coding Plan</title>
  <link rel="stylesheet" href="style.css?v=5">
</head>
<body>
  <!-- ===== 顶部 ===== -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-logo">GLM</span>
      <div class="brand-text">
        <h1>用量监控</h1>
        <p>智谱 BigModel · Coding Plan</p>
      </div>
    </div>
    <div class="topbar-right">
      <span id="last-updated" class="last-updated"></span>
    </div>
  </header>

  <!-- ===== 底部：左 Key 管理 / 右 用量 ===== -->
  <main class="layout">
    <!-- 左侧：API Key 管理 -->
    <aside class="panel keys-panel">
      <div class="panel-head">
        <h2>API Key 管理</h2>
        <button id="btn-toggle-add" class="btn btn-primary btn-sm" type="button">＋ 添加</button>
      </div>

      <form id="add-form" class="add-form hidden" autocomplete="off">
        <input id="add-alias" type="text" maxlength="30" placeholder="备注名（可选，如：主号）">
        <input id="add-key" type="password" placeholder="粘贴 API Key" required>
        <div class="add-form-actions">
          <label class="show-key"><input id="add-show" type="checkbox"> 显示</label>
          <button type="submit" class="btn btn-primary btn-sm">保存</button>
        </div>
      </form>

      <ul id="key-list" class="key-list"></ul>
      <div id="keys-empty" class="empty-tip">
        还没有添加 Key。<br>点击右上角「＋ 添加」开始。
      </div>

      <p class="keys-hint">🔒 Key 仅保存在本浏览器本地（localStorage），不会上传到任何服务器。</p>
      <div class="wx-contact" data-copy-text="fuyapeng1214" title="点击复制微信号">
        <svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true"><path fill="#07C160" d="M8.691 2.188C3.891 2.188 0 5.476 0 9.53c0 2.212 1.17 4.203 3.002 5.55a.59.59 0 0 1 .213.665l-.39 1.48c-.019.07-.048.141-.048.213 0 .163.13.295.29.295a.326.326 0 0 0 .167-.054l1.903-1.114a.864.864 0 0 1 .717-.098 10.16 10.16 0 0 0 2.837.403c.276 0 .543-.027.811-.05-.857-2.578.157-4.972 1.932-6.446 1.703-1.415 3.882-1.98 5.853-1.838-.576-3.583-4.196-6.348-8.596-6.348zM5.785 5.991c.642 0 1.162.529 1.162 1.18a1.17 1.17 0 0 1-1.162 1.178A1.17 1.17 0 0 1 4.623 7.17c0-.651.52-1.18 1.162-1.18zm5.813 0c.642 0 1.162.529 1.162 1.18a1.17 1.17 0 0 1-1.162 1.178 1.17 1.17 0 0 1-1.162-1.178c0-.651.52-1.18 1.162-1.18zm5.34 2.867c-1.797-.052-3.746.512-5.28 1.786-1.72 1.428-2.687 3.72-1.78 6.22.942 2.453 3.666 4.229 6.884 4.229.826 0 1.622-.12 2.361-.336a.722.722 0 0 1 .598.082l1.584.926a.272.272 0 0 0 .14.047c.134 0 .24-.111.24-.247 0-.06-.023-.12-.038-.177l-.327-1.233a.582.582 0 0 1-.023-.156.49.49 0 0 1 .201-.398C23.024 18.48 24 16.82 24 14.98c0-3.21-2.931-5.837-6.656-6.088V8.89c-.135-.01-.27-.027-.407-.03zm-2.53 3.274c.535 0 .969.44.969.982a.976.976 0 0 1-.969.983.976.976 0 0 1-.969-.983c0-.542.434-.982.97-.982zm4.844 0c.535 0 .969.44.969.982a.976.976 0 0 1-.969.983.976.976 0 0 1-.969-.983c0-.542.434-.982.969-.982z"/></svg>
        接口报错 / 查询失效？点击复制微信号反馈
        <div class="wx-id">fuyapeng1214</div>
      </div>
    </aside>

    <!-- 右侧：用量信息 -->
    <section class="panel usage-panel">
      <div class="panel-head">
        <h2 id="usage-title">用量信息</h2>
        <button id="btn-refresh" class="btn btn-ghost btn-sm" type="button" disabled>↻ 刷新</button>
      </div>
      <div id="usage-body" class="usage-body">
        <div class="state state-empty">
          <div class="state-icon">📊</div>
          <p>在左侧选择一个 API Key 查看用量</p>
        </div>
      </div>
    </section>
  </main>

  <!-- 删除二次确认弹框 -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h3 id="modal-title">删除确认</h3>
      <p id="modal-text"></p>
      <div class="modal-actions">
        <button id="modal-cancel" class="btn btn-ghost btn-sm" type="button">取消</button>
        <button id="modal-confirm" class="btn btn-danger btn-sm" type="button">删除</button>
      </div>
    </div>
  </div>

  <!-- 轻提示 -->
  <div id="toast" class="toast hidden"></div>

  <script src="app.js?v=4"></script>
</body>
</html>
