<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GLM 用量监控 - 智谱 Coding Plan</title>
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
  <!-- ===== 顶部 ===== -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-logo">GLM</span>
      <div class="brand-text">
        <h1>用量监控</h1>
        <p>智谱 BigModel · Coding Plan</p>
      </div>
    </div>
    <div class="topbar-right">
      <span id="last-updated" class="last-updated"></span>
    </div>
  </header>

  <!-- ===== 底部：左 Key 管理 / 右 用量 ===== -->
  <main class="layout">
    <!-- 左侧：API Key 管理 -->
    <aside class="panel keys-panel">
      <div class="panel-head">
        <h2>API Key 管理</h2>
        <button id="btn-toggle-add" class="btn btn-primary btn-sm" type="button">＋ 添加</button>
      </div>

      <form id="add-form" class="add-form hidden" autocomplete="off">
        <input id="add-alias" type="text" maxlength="30" placeholder="备注名（可选，如：主号）">
        <input id="add-key" type="password" placeholder="粘贴 API Key" required>
        <div class="add-form-actions">
          <label class="show-key"><input id="add-show" type="checkbox"> 显示</label>
          <button type="submit" class="btn btn-primary btn-sm">保存</button>
        </div>
      </form>

      <ul id="key-list" class="key-list"></ul>
      <div id="keys-empty" class="empty-tip">
        还没有添加 Key。<br>点击右上角「＋ 添加」开始。
      </div>

      <p class="keys-hint">🔒 Key 仅保存在本浏览器本地（localStorage），不会上传到任何服务器。</p>
      <p class="keys-hint"><svg viewBox="0 0 576 512" width="13" height="13" style="vertical-align:-2px" aria-hidden="true"><path fill="#07C160" d="M385.2 167.6c6.4 0 12.6.3 18.8 1.1C387.4 90.3 303.3 32 207.7 32 100.5 32 13 104.8 13 197.4c0 53.4 29.3 97.5 77.9 131.6l-19.3 58.6 68-34.1c24.4 4.8 43.8 9.7 68.2 9.7 6.2 0 12.1-.3 18.3-.8-4-12.9-6.2-26.6-6.2-40.8-.1-84.9 72.9-154 165.2-154zm-101.3 52.3c14.5 0 24.2 9.7 24.2 23.9 0 14.6-9.7 24.2-24.2 24.2-14.2 0-28.5-9.7-28.5-24.2.2-14.2 14.3-23.9 28.5-23.9zm-111.4 24.2c0-14.2-9.7-23.9-24.2-23.9-14.2 0-28.5 9.7-28.5 23.9 0 14.6 14.3 24.2 28.5 24.2 14.5 0 24.2-9.6 24.2-24.2zm116.2 128.5c-77 0-140.4-52.1-140.4-116 0-6.4.7-12.9 2.4-18.9-5.9-.8-11.7-1-17.8-1-10.3 0-20.4 1.5-30.4 3.3l-32.4-16.2 18.3 48.6C46 299.3 0 341.5 0 391.5c0 65.2 69.1 118 154.4 118 79.9 0 148.9-47.8 162.4-107.3-6.5.8-13.1 1.1-19.8 1.1zM132.1 348.4c-12.2 0-21.9-9.7-21.9-21.9 0-12.2 9.7-21.9 21.9-21.9 12.2 0 21.9 9.7 21.9 21.9 0 12.2-9.7 21.9-21.9 21.9zm116.3 0c-12.2 0-21.9-9.7-21.9-21.9 0-12.2 9.7-21.9 21.9-21.9 12.2 0 21.9 9.7 21.9 21.9 0 12.2-9.7 21.9-21.9 21.9z"/></svg> 接口报错 / 查询失效？微信联系：<b>fuyapeng1214</b>（备注 glm-usage）</p>
    </aside>

    <!-- 右侧：用量信息 -->
    <section class="panel usage-panel">
      <div class="panel-head">
        <h2 id="usage-title">用量信息</h2>
        <button id="btn-refresh" class="btn btn-ghost btn-sm" type="button" disabled>↻ 刷新</button>
      </div>
      <div id="usage-body" class="usage-body">
        <div class="state state-empty">
          <div class="state-icon">📊</div>
          <p>在左侧选择一个 API Key 查看用量</p>
        </div>
      </div>
    </section>
  </main>

  <!-- 删除二次确认弹框 -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h3 id="modal-title">删除确认</h3>
      <p id="modal-text"></p>
      <div class="modal-actions">
        <button id="modal-cancel" class="btn btn-ghost btn-sm" type="button">取消</button>
        <button id="modal-confirm" class="btn btn-danger btn-sm" type="button">删除</button>
      </div>
    </div>
  </div>

  <!-- 轻提示 -->
  <div id="toast" class="toast hidden"></div>

  <script src="app.js?v=3"></script>
</body>
</html>
